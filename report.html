<!doctype html><html><head><meta charset="utf-8"><title>ProMail Tracker — Report</title>
<style>
:root{--bg:#e0e5ec;--dark:#a9aeb9;--light:#fff;--tx:#3d434e;--mut:#7b8290;--green:#0b7a55;--greenbg:#d3e5da}
@media(prefers-color-scheme:dark){:root{--bg:#2f333c;--dark:#22252d;--light:#414755;--tx:#dde1e9;--mut:#9aa1af;--green:#3ecf8e;--greenbg:#26332d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding:28px}.wrap{max-width:1100px;margin:auto}.card{background:var(--bg);border-radius:18px;padding:20px;box-shadow:8px 8px 16px var(--dark),-8px -8px 16px var(--light);margin-bottom:18px}h1{margin:0;font-size:22px}.sub{color:var(--mut);font-size:13px;margin-top:5px}.stats{display:flex;gap:14px;flex-wrap:wrap}.stat{min-width:150px;padding:16px;border-radius:14px;box-shadow:inset 4px 4px 8px var(--dark),inset -4px -4px 8px var(--light)}.stat b{display:block;font-size:22px;color:var(--green)}table{width:100%;border-collapse:separate;border-spacing:0 8px;font-size:13px}th{font-size:12px;color:var(--mut);text-align:left;padding:6px 10px}td{padding:11px 10px;background:var(--bg);box-shadow:4px 4px 8px var(--dark),-4px -4px 8px var(--light)}td:first-child{border-radius:10px 0 0 10px}td:last-child{border-radius:0 10px 10px 0}.c{text-align:center}.empty{text-align:center;color:var(--mut);padding:30px}.error{color:#c0392b}
h2.sect{font-size:16px;margin:22px 0 8px}.note{color:var(--mut);font-size:12px;line-height:1.6;max-width:760px}
.row{margin:18px 0 4px}button{border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:var(--tx);background:var(--bg);border-radius:12px;padding:10px 18px;box-shadow:4px 4px 8px var(--dark),-4px -4px 8px var(--light)}button:active{box-shadow:inset 4px 4px 8px var(--dark),inset -4px -4px 8px var(--light)}button.primary{background:var(--greenbg);color:var(--green)}
</style></head><body><div class="wrap"><div class="card"><h1>ProMail Tracker — <span id="kind">Report</span> <span style="font-size:12px;color:var(--mut);font-weight:400">v2.3.0</span></h1><div class="sub" id="range">Loading…</div></div><div id="stats" class="stats"></div><div class="card"><div id="body">Loading…</div></div></div><script src="report.js"></script></body></html>
