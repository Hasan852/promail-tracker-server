<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 360px; margin: 0; font-family: system-ui, Arial, sans-serif; color: #222; }
  header { background: #0b7a55; color: #fff; padding: 12px 14px; }
  header h1 { margin: 0; font-size: 16px; }
  header p { margin: 4px 0 0; font-size: 12px; opacity: .9; }
  #status { padding: 8px 14px; font-size: 12px; background: #f4f6f8; border-bottom: 1px solid #e3e6e9; }
  #list { max-height: 300px; overflow-y: auto; }
  .item { padding: 10px 14px; border-bottom: 1px solid #eee; display: flex; gap: 10px; }
  .serial { font-size: 15px; font-weight: 700; color: #999; flex-shrink: 0; }
  .item .body { flex: 1; min-width: 0; }
  .item .to { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tick { font-weight: 700; margin-right: 4px; }
  .tick.open { color: #00b578; }
  .tick.unopen { color: #999; }
  .item .subj { font-size: 12px; color: #666; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .meta { font-size: 12px; color: #666; margin-top: 3px; }
  .item .from { font-size: 11px; color: #999; margin-top: 2px; }
  .pill { display: inline-block; background: #e6f4ed; color: #0b7a55; border-radius: 10px; padding: 1px 8px; font-size: 11px; margin-right: 4px; }
  .pill.zero { background: #f1f1f1; color: #888; }
  .empty { padding: 24px 14px; text-align: center; color: #888; font-size: 13px; }
  footer { padding: 10px 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  button { flex: 1; padding: 8px; border: 1px solid #0b7a55; background: #fff; color: #0b7a55; border-radius: 8px; cursor: pointer; font-size: 12px; }
  button.primary { background: #0b7a55; color: #fff; border: none; }
  button:hover { opacity: .9; }
</style>
</head>
<body>
<header>
  <h1>📧 ProMail Tracker</h1>
</header>
<div id="status">checking…</div>
<div id="list"></div>
<footer>
  <button id="refresh">↻ Refresh</button>
  <button id="weekly" class="primary">Weekly</button>
  <button id="monthly" class="primary">Monthly</button>
  <button id="settings">⚙ Settings</button>
</footer>
<script src="popup.js"></script>
</body>
</html>
