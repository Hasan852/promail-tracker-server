<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --nbg: #e0e5ec; --ndark: #a9aeb9; --nlight: #ffffff;
    --ntx: #3d434e; --nmut: #7b8290;
    --ngrn: #0b7a55; --ngrn2: #00b578; --ngrnbg: #d3e5da;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --nbg: #2f333c; --ndark: #22252d; --nlight: #414755;
      --ntx: #dde1e9; --nmut: #9aa1af;
      --ngrn: #3ecf8e; --ngrn2: #3ecf8e; --ngrnbg: #26332d;
    }
  }
  * { box-sizing: border-box; }
  body { width: 360px; margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; background: var(--nbg); color: var(--ntx); }
  .wrap { padding: 14px; }

  header { background: var(--nbg); border-radius: 16px; padding: 13px 15px;
    box-shadow: 6px 6px 12px var(--ndark), -6px -6px 12px var(--nlight);
    display: flex; align-items: center; gap: 11px; }
  .ico { width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0;
    background: var(--nbg); box-shadow: inset 3px 3px 6px var(--ndark), inset -3px -3px 6px var(--nlight);
    display: flex; align-items: center; justify-content: center; color: var(--ngrn); }
  header h1 { margin: 0; font-size: 16px; font-weight: 700; }
  header p { margin: 2px 0 0; font-size: 11px; color: var(--nmut); }

  #status { margin: 12px 2px 0; border-radius: 999px; padding: 8px 14px; font-size: 11px;
    color: var(--nmut); background: var(--nbg);
    box-shadow: inset 4px 4px 8px var(--ndark), inset -4px -4px 8px var(--nlight); }

  #list { max-height: 300px; overflow-y: auto; margin-top: 12px; padding: 2px; }
  #list::-webkit-scrollbar { width: 6px; }
  #list::-webkit-scrollbar-thumb { background: var(--ndark); border-radius: 3px; }

  .item { background: var(--nbg); border-radius: 16px; padding: 12px 14px; margin-bottom: 12px;
    box-shadow: 6px 6px 12px var(--ndark), -6px -6px 12px var(--nlight);
    display: flex; gap: 12px; }
  .serial { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    background: var(--nbg); box-shadow: inset 3px 3px 6px var(--ndark), inset -3px -3px 6px var(--nlight);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: var(--nmut); }
  .item .body { flex: 1; min-width: 0; }
  .item .to { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tick { font-weight: 700; margin-right: 5px; }
  .tick.open { color: var(--ngrn2); }
  .tick.unopen { color: var(--nmut); }
  .item .subj { font-size: 12px; color: var(--nmut); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .meta { font-size: 11px; color: var(--nmut); margin-top: 5px; }
  .item .meta b { color: var(--ngrn); }
  .item .from { font-size: 11px; color: var(--nmut); margin-top: 2px; }
  .item { cursor: pointer; }
  .item.child { margin-left: 26px; }
  .followtag { font-size: 10px; font-weight: 600; color: var(--ngrn); background: var(--ngrnbg);
    border-radius: 999px; padding: 1px 8px; margin-left: 6px; vertical-align: 1px; }
  .history { margin-top: 8px; border-radius: 12px; padding: 8px 12px; background: var(--nbg);
    box-shadow: inset 3px 3px 6px var(--ndark), inset -3px -3px 6px var(--nlight); }
  .hrow { font-size: 11px; color: var(--nmut); padding: 3px 0; }
  .hnum { display: inline-block; min-width: 28px; font-weight: 700; color: var(--ngrn); }
  .hnote { font-style: italic; opacity: .85; }
  #syncinfo { margin: 8px 2px 0; font-size: 11px; color: var(--nmut); }
  .empty { margin-top: 4px; border-radius: 16px; padding: 26px 16px; text-align: center;
    color: var(--nmut); font-size: 13px; background: var(--nbg);
    box-shadow: inset 4px 4px 8px var(--ndark), inset -4px -4px 8px var(--nlight); }

  footer { display: flex; gap: 10px; margin-top: 14px; }
  button { flex: 1; border: none; cursor: pointer; font-family: inherit;
    font-size: 12px; font-weight: 600; color: var(--ntx);
    background: var(--nbg); border-radius: 12px; padding: 10px 4px;
    box-shadow: 4px 4px 8px var(--ndark), -4px -4px 8px var(--nlight); }
  button:active { box-shadow: inset 4px 4px 8px var(--ndark), inset -4px -4px 8px var(--nlight); }
  button.primary { background: var(--ngrnbg); color: var(--ngrn); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg></div>
    <div><h1>ProMail Tracker</h1><p>v2.4.1 &middot; soft UI &middot; <span title="Email tracking detects image loading. It cannot guarantee that a person read the message.">ⓘ detection = image loads</span></p></div>
  </header>
  <div id="status">checking&hellip;</div>
  <div id="syncinfo" hidden></div>
  <div id="list"></div>
  <footer>
    <button id="refresh">&#8635; Refresh</button>
    <button id="clear">&#128465; Clear list</button>
    <button id="weekly" class="primary">Weekly</button>
    <button id="monthly" class="primary">Monthly</button>
    <button id="settings">&#9881; Settings</button>
  </footer>
</div>
<script src="config.js"></script>
<script src="popup.js"></script>
</body>
</html>
